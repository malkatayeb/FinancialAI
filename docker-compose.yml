services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama serve & sleep 15; ollama pull llama3.2; wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -qi llama3.2"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 180s

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama:
